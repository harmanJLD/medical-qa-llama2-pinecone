<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical Q&amp;A</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header>
      <h1>Medical Q&amp;A</h1>
      <p>Answers from an indexed medical reference, generated by Llama 2 7B. Each answer lists the pages it used.</p>
    </header>
    <div id="chat" aria-live="polite">
      <div class="bubble bot">Ask a question about the medical reference, for example "What causes iron-deficiency anemia?"</div>
    </div>
    <form id="ask-form">
      <textarea id="question" rows="2" maxlength="1000" placeholder="Type your question" required></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <p class="note">General information only, not medical advice. In an emergency, call 911.</p>
  </div>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
